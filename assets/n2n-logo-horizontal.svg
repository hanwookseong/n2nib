<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" role="img" aria-label="N2N Insurance Brokerage">
  <title>N2N Insurance Brokerage</title>
  <desc>Horizontal lockup: three-disc N2N mark beside INSURANCE Brokerage and Services wordmark.</desc>

  <!-- 3-disc mark (left) -->
  <circle cx="50" cy="60" r="40" fill="#0B2818"/>
  <circle cx="120" cy="60" r="40" fill="#D97757"/>
  <circle cx="190" cy="60" r="40" fill="#0B2818"/>

  <!-- N 2 N letters -->
  <text x="50" y="76" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="48" font-weight="800" letter-spacing="-2"
        fill="#F4F0E8">N</text>
  <text x="120" y="76" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="48" font-weight="800"
        fill="#F4F0E8">2</text>
  <text x="190" y="76" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="48" font-weight="800" letter-spacing="-2"
        fill="#F4F0E8">N</text>

  <!-- Wordmark beside (right side) -->
  <text x="250" y="55"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="26" font-weight="800" letter-spacing="3"
        fill="#0B2818">INSURANCE</text>
  <text x="250" y="82"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="16" font-weight="500" letter-spacing="1.5"
        fill="#0B2818">Brokerage &amp; Services</text>
</svg>
